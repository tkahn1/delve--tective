<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=380" />
    <title>delve—tective</title>
  </head>
  <body>
    <main class="popup">
      <header class="row header">
        <span class="brand">
          <span class="logo" id="logo"></span>
          <span class="name">delve—tective</span>
        </span>
        <label class="switch" title="Turn delve—tective on or off">
          <input type="checkbox" id="enabled" role="switch" aria-label="delve—tective on" />
          <span class="track"><span class="thumb"></span></span>
        </label>
      </header>

      <section class="section" id="this-page">
        <div class="label">This page</div>
        <div id="page-body"></div>
        <div class="copies" id="copies" hidden>
          <div class="copies-label">Comments</div>
          <p class="copies-head" id="copies-head"></p>
          <p class="muted copies-sub" id="copies-sub"></p>
        </div>
      </section>

      <section class="section">
        <div class="field-title">Flagged results</div>
        <div class="segmented" role="radiogroup" aria-label="Flagged results: search results and repeated comments">
          <button type="button" role="radio" data-mode="dim">Dim</button>
          <button type="button" role="radio" data-mode="hide">Hide</button>
        </div>
        <div class="helper mode-help">Search results and repeated comments.</div>
        <div class="row site-row" id="site-row" hidden>
          <div class="site-text">
            <div class="site-title" id="site-title"></div>
            <div class="helper">Turn off to skip this site</div>
          </div>
          <button type="button" id="trust-site" class="mark-site trust">Not slop</button>
          <button type="button" id="mark-site" class="mark-site">Mark as slop</button>
          <label class="switch">
            <input type="checkbox" id="site-enabled" role="switch" />
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>
      </section>

      <section class="section">
        <div class="field-title">Sensitivity</div>
        <div class="segmented three" role="radiogroup" aria-label="Sensitivity">
          <button type="button" role="radio" data-sens="relaxed" aria-label="Less: fewest flags">Less</button>
          <button type="button" role="radio" data-sens="balanced" aria-label="Normal: recommended">Normal</button>
          <button type="button" role="radio" data-sens="strict" aria-label="More: most flags">More</button>
        </div>
        <div class="helper sens-help" id="sens-help" aria-live="polite"></div>
      </section>

      <section class="section counts">
        <div class="count">
          <div class="big" id="count-dimmed">0</div>
          <div class="count-label">results flagged this week</div>
        </div>
        <div class="count">
          <div class="big" id="count-pages">0</div>
          <div class="count-label">pages flagged this week</div>
        </div>
      </section>

      <button type="button" class="section row link-row" id="manage-link">
        <span>
          <span class="link-title">My sites</span>
          <span class="helper">Sites you marked or trust</span>
        </span>
        <span class="chevron">›</span>
      </button>

      <button type="button" class="section row link-row" id="report-link">
        <span>
          <span class="link-title">Browsing activity</span>
          <span class="helper">This week and earlier</span>
        </span>
        <span class="chevron" id="chevron"></span>
      </button>

      <button type="button" class="section row link-row" id="dev-link" aria-expanded="false" aria-controls="dev-panel">
        <span class="link-title">Developer options</span>
        <span class="chevron dev-chevron" id="dev-chevron"></span>
      </button>

      <section class="section dev-row" id="dev-panel" hidden>
        <div class="row">
          <div class="site-text">
            <div class="dev-title">YouTube API key</div>
            <div class="helper" id="yt-api-status">Checking…</div>
          </div>
          <label class="switch" title="Use the saved YouTube Data API key for comment copies">
            <input type="checkbox" id="yt-use-api" role="switch" aria-label="Use YouTube API key" aria-describedby="yt-api-status" />
            <span class="track"><span class="thumb"></span></span>
          </label>
        </div>
        <div class="dev-title dev-sub">Repeated comments on this tab</div>
        <dl class="metrics" id="copies-metrics"><dt>Status</dt><dd>Not running on this tab</dd></dl>
      </section>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
